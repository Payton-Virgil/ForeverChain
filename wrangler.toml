name = "foreverchain"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "foreverchain-db"
database_id = "e7a94333-7b90-419f-89ca-c5ae4ddd6d1e"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "foreverchain-media"

[vars]
APP_NAME = "ForeverChain"
MAX_FILE_BYTES = "10485760"
